<div class="login-page-container">
  <div class="login-card">
    <div class="login-card-body">

      <!-- Custom CSS Logo matching reference -->
      <div class="logo-wrapper">
        <div class="logo-icon bg-warning text-dark d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 50px; height: 50px; border-radius: 10px;">
          <i class="bi bi-airplane-fill fs-2"></i>
        </div>
        <div class="text-center">
          <div class="brand-name">Travel</div>
          <div class="brand-sub">CRM</div>
          <div class="brand-tagline">We Are Working For The Guest Experience</div>
        </div>
        <div class="login-title">Travel CRM Login</div>
      </div>

      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-floating mb-3">
          <select class="form-select" id="roleInput" formControlName="role_type" style="border: 1px solid #cbd5e1; border-radius: 0.5rem; height: 3.25rem; font-size: 0.95rem; background-color: #f8fafc;">
            <option value="Super Admin">Admin</option>
            <option value="Manager">Manager</option>
            <option value="Sales Executive">Sales Executive</option>
            <option value="Operation Team">Operation Team</option>
            <option value="Accounts">Accounts</option>
          </select>
          <label for="roleInput">Login As</label>
        </div>

        <div class="form-floating">
          <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" autocomplete="email" formControlName="email">
          <label for="emailInput">Email</label>
        </div>

        <div class="form-floating">
          <input type="password" class="form-control" id="passwordInput" placeholder="Password" autocomplete="current-password" formControlName="password">
          <label for="passwordInput">Password</label>
        </div>

        <div class="extra-links">
          <div class="form-check">
            <input class="form-check-input shadow-sm" type="checkbox" id="rememberMe">
            <label class="form-check-label" for="rememberMe">
              Remember me
            </label>
          </div>
          <a href="javascript:void(0)" class="forgot-link">Forgot Password?</a>
        </div>

        @if (errorMessage) {
          <div class="alert alert-danger mt-3">
            {{ errorMessage }}
          </div>
        }

        <button type="submit" class="btn btn-login w-100" [disabled]="loginForm.invalid || isLoading">
          @if (isLoading) {
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          }
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>
      </form>

    </div>
  </div>
</div>
