<div class="login-page-container">
  <div class="login-card">
    <div class="login-card-body">
      
      <!-- Custom CSS Logo matching reference -->
      <div class="logo-wrapper">
        <div class="logo-icon">
          <span class="letter-a">A</span>
          <span class="letter-h">H</span>
        </div>
        <div class="text-center">
          <div class="brand-name">Alveera</div>
          <div class="brand-sub">Hospitality</div>
          <div class="brand-tagline">We Are Working For The Guest Experience</div>
        </div>
        <div class="login-title">Travel CRM Login</div>
      </div>

      <!-- Login Form -->
      <form>
        <div class="form-floating">
          <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" autocomplete="email">
          <label for="emailInput">Email</label>
        </div>
        
        <div class="form-floating">
          <input type="password" class="form-control" id="passwordInput" placeholder="Password" autocomplete="current-password">
          <label for="passwordInput">Password</label>
        </div>

        <div class="extra-links">
          <div class="form-check">
            <input class="form-check-input shadow-sm" type="checkbox" id="rememberMe">
            <label class="form-check-label" for="rememberMe">
              Remember me
            </label>
          </div>
          <a href="javascript:void(0)" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="button" class="btn btn-login w-100" routerLink="/dashboard">
          Login
        </button>
      </form>

    </div>
  </div>
</div>
