<div class="container-fluid p-0">
  
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end mb-4 gap-3">
    <div>
      <h3 class="mb-1 fw-bold text-slate-800 d-flex align-items-center gap-2">Roles & Permissions</h3>
      <p class="text-slate-500 mb-0" style="font-size: 0.95rem;">Manage custom roles and access control.</p>
    </div>
    
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-primary d-flex align-items-center gap-2 rounded-3 px-4 py-2 fw-semibold shadow-sm transition-all hover-lift" type="button" data-bs-toggle="offcanvas" data-bs-target="#roleFormOffcanvas" (click)="showAdd()">
        <i class="bi bi-shield-plus"></i> New Role
      </button>
    </div>
  </div>

  <app-data-table [dataList]="roles()" [pagination]="true">
    <ng-template appColumn="name" header="Role Name" let-row>
      <div class="d-flex flex-column">
        <span class="text-slate-800 fw-bold">{{row.name}}</span>
      </div>
    </ng-template>
    
    <ng-template appColumn="description" header="Description" let-row>
      <span class="text-slate-500" style="font-size: 0.85rem;">{{row.description}}</span>
    </ng-template>

    <ng-template appColumn="actions" header="" let-row>
      <div class="d-flex justify-content-end gap-2">
        <button class="btn btn-sm btn-light text-primary" data-bs-toggle="offcanvas" data-bs-target="#roleFormOffcanvas" (click)="editRole(row)" title="Edit Role">
          <i class="bi bi-pencil"></i>
        </button>
      </div>
    </ng-template>
  </app-data-table>
</div>

<!-- Add/Edit Role Offcanvas -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="roleFormOffcanvas" style="width: 700px; border-left: none; box-shadow: -10px 0 40px rgba(0,0,0,0.08);">
  
  <div class="offcanvas-header border-bottom px-4 py-3 bg-light d-flex align-items-center justify-content-between">
    <h5 class="offcanvas-title fw-bold text-slate-800 mb-0 lh-1">{{ editingRoleId() ? 'Edit Role' : 'Create New Role' }}</h5>
    <button type="button" class="btn-close text-reset shadow-none" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>

  <div class="offcanvas-body p-4 bg-white" style="overflow-y: auto;">
    <form class="row g-4" [formGroup]="roleForm">
      
      <div class="col-12">
        <label class="form-label text-slate-700 fw-medium mb-1 small">Role Name <span class="text-danger">*</span></label>
        <input type="text" formControlName="name" class="form-control bg-light border-0 py-2" placeholder="e.g. Senior Sales Specialist">
      </div>

      <div class="col-12">
        <label class="form-label text-slate-700 fw-medium mb-1 small">Description <span class="text-danger">*</span></label>
        <textarea formControlName="description" class="form-control bg-light border-0 py-2" rows="2" placeholder="Describe the purpose of this role"></textarea>
      </div>

      <div class="col-12 mt-4">
        <h6 class="fw-bold text-slate-800 border-bottom pb-2 mb-3">Permissions Matrix</h6>
        
        <div *ngIf="permissionsLoading()" class="text-center py-4">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <div *ngIf="!permissionsLoading()">
          <div class="card border border-light-subtle shadow-sm mb-3" *ngFor="let modPerm of permissions()">
            <div class="card-header bg-light border-bottom border-light-subtle py-2">
              <h6 class="mb-0 fw-bold text-capitalize text-slate-700">{{ modPerm.module }}</h6>
            </div>
            <div class="card-body p-3">
              <div class="row g-2">
                <div class="col-md-6 col-lg-4" *ngFor="let perm of modPerm.permissions">
                  <div class="form-check custom-checkbox">
                    <input class="form-check-input" type="checkbox" 
                           [id]="'perm_' + perm.id" 
                           [checked]="selectedPermissions().has(perm.id)"
                           (change)="togglePermission(perm.id)">
                    <label class="form-check-label text-slate-600 small ms-1" [for]="'perm_' + perm.id">
                      {{ perm.description }}
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
  
  <div class="offcanvas-footer border-top p-4 bg-light d-flex justify-content-end gap-3 z-3">
    <button type="button" class="btn btn-white border px-4 py-2 fw-medium text-slate-600" data-bs-dismiss="offcanvas">Cancel</button>
    <button type="button" class="btn btn-primary px-5 py-2 fw-medium shadow-sm d-flex align-items-center gap-2" (click)="saveRole()" [disabled]="roleForm.invalid || isSaving() || selectedPermissions().size === 0" [attr.data-bs-dismiss]="roleForm.valid && selectedPermissions().size > 0 ? 'offcanvas' : null">
      <span *ngIf="isSaving()" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
      <i class="bi bi-check2" *ngIf="!isSaving()"></i> {{ isSaving() ? 'Saving...' : 'Save Role' }}
    </button>
  </div>
</div>
