name: Deploy Stage

on:
  push:
    branches:
      - stage

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build CRM (Stage)
        run: npx ng build crm --configuration production --base-href https://safarsystem.demohandler.in/

      - name: Verify Build Output
        run: |
          ls -R dist/crm/browser/

      - name: Deploy CRM to Stage
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 145.79.211.128
          username: u479097380
          password: ${{ secrets.FTP_PASSWORD_STAGE }}
          port: 21
          protocol: ftp
          timeout: 120000
          log-level: verbose
          local-dir: ./dist/crm/browser/
          server-dir: /domains/demohandler.in/public_html/safarsystem/
          dangerous-clean-slate: false
          exclude: |
            **/.htaccess
            api/**

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Deployment Successful - CRM Safar System
          to: ashwanipandeytech@gmail.com, tusharmanusharma@gmail.com, Mail2aman168@gmail.com, pushpendradwivedi9@gmail.com, rohitsingh28dec@gmail.com
          from: CRM CI/CD <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deployment of CRM Safar System to stage was successful.
            
            Commit: ${{ github.sha }}
            Workflow: ${{ github.workflow }}
            Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Deployment Failed - CRM Safar System
          to: ashwanipandeytech@gmail.com, pushpendradwivedi9@gmail.com, rohitsingh28dec@gmail.com
          from: CRM CI/CD <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deployment of CRM Safar System to stage failed. 
            
            Commit: ${{ github.sha }}
            Workflow: ${{ github.workflow }}
            Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Please check the GitHub Actions logs for more details.
